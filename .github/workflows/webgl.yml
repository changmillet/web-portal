name: WebGL manual verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_WEBGL_TESTS: "1"
      PORTAL_STORYBOOK_SOFTWARE_WEBGL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium cache
        id: playwright-webgl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-webgl-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: WebGL component interactions
        run: pnpm test:storybook
      - name: Homepage WebGL performance
        run: pnpm test:e2e -- --grep 'home stays inside the local Core Web Vitals guard'
